# Conda environment matching the one that produced the published results (Linux, CUDA 11.8).
#   mamba env create -f environment.yml && conda activate ctfm-opc
# PyTorch comes from the pytorch/nvidia channels as in the original environment; everything else from PyPI
# with the versions of requirements.txt.
name: ctfm-opc
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.17
  - pytorch=2.5.1=py3.10_cuda11.8_cudnn9.1.0_0
  - pytorch-cuda=11.8
  - torchvision=0.20.1
  - pyyaml=6.0.2
  - pip
  - pip:
      - monai==1.4.1rc1
      - lighter-zoo==0.1.3
      - huggingface-hub==0.32.2
      - safetensors==0.5.3
      - nibabel==5.3.2
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - scikit-survival==0.25.0
      - lifelines==0.30.0
      - autograd==1.8.0
      - formulaic==1.2.1
      - matplotlib==3.10.3
      - seaborn==0.13.2
      # OPTIONAL, SPECTRE baseline only: uncomment, then  pip install --no-deps spectre-fm==0.1.0
      # - timm==1.0.22
      # - transformers==4.40.2
      # - tokenizers==0.19.1
      # - accelerate==1.12.0
      # - peft==0.18.0
      # - loralib==0.1.2
      # - omegaconf==2.4.0.dev3
      # - SimpleITK==2.5.2
      # - wandb==0.19.6
      # - openpyxl==3.1.5
      # - umap-learn==0.5.9.post2
